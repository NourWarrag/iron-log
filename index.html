<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Log</title>
<meta name="description" content="Shared gym log for the crew: quick set entry, lift trends and a big-three leaderboard.">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one narrow column like a gym logbook, fixed bottom tab bar (Log · Progress · Crew), members coded by plate colours */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --sunk:#E4E7EB; --fg:#16191D; --muted:#5D6670; --line:#D3D8DE;
  --accent:#C8102E; --accent-fg:#FFFFFF; --accent-soft:#F7DDE1; --good:#1E7B4F; --warn:#9A6400;
  --p-red:#C8102E; --p-blue:#1F5FBF; --p-yellow:#C99700; --p-green:#2E8B45; --p-ink:#3A4048;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1A1E23; --sunk:#23282E; --fg:#E8EBEE; --muted:#97A1AC; --line:#2D333B;
  --accent:#FF4D5E; --accent-fg:#16090B; --accent-soft:#3A1A1F; --good:#4CC38A; --warn:#E6B44C;
  --p-red:#FF4D5E; --p-blue:#5B9BFF; --p-yellow:#F2C230; --p-green:#4CC36A; --p-ink:#C3C9D0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1A1E23; --sunk:#23282E; --fg:#E8EBEE; --muted:#97A1AC; --line:#2D333B;
  --accent:#FF4D5E; --accent-fg:#16090B; --accent-soft:#3A1A1F; --good:#4CC38A; --warn:#E6B44C;
  --p-red:#FF4D5E; --p-blue:#5B9BFF; --p-yellow:#F2C230; --p-green:#4CC36A; --p-ink:#C3C9D0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:12px 96px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;line-height:1}
h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:1.2rem}
.num,input[type=number]{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.top .sub{font-size:.85rem;color:var(--muted)}
.status{font-size:.8rem;color:var(--muted);text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.chip{padding:7px 12px;font-size:.9rem;background:var(--sunk);border-color:var(--sunk)}
button.danger{color:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input[type=number]{-moz-appearance:textfield;text-align:center}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.grow{flex:1;min-width:0}
/* template grid */
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl button{text-align:left;padding:12px;display:flex;flex-direction:column;gap:2px;border-left:6px solid var(--plate)}
.tpl button b{font-family:var(--display);font-size:1.35rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.tpl button span{font-size:.8rem;color:var(--muted);font-weight:500}
/* active workout */
.ex{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:4px}
.ex-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ex-name{font-family:var(--display);font-size:1.3rem;font-weight:700;min-width:0;overflow-wrap:anywhere}
.last{font-size:.8rem;color:var(--muted)}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) 14px minmax(0,1fr) 36px;align-items:center;gap:6px}
.set .n{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.set .x{color:var(--muted);text-align:center}
.set input{width:100%;font-size:1.1rem;font-weight:600;padding:10px 6px}
.set-head{display:grid;grid-template-columns:28px minmax(0,1fr) 14px minmax(0,1fr) 36px;gap:6px}
.set-head .label{text-align:center}
.del{padding:6px;border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1}
.title-in{font-family:var(--display);font-size:1.6rem;font-weight:700;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:2px 0;width:100%}
.save{font-size:.8rem}
.save.ok{color:var(--good)} .save.bad{color:var(--accent)}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-main{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item-main b{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:10px}
.stat .v{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.1}
.chart{width:100%;height:auto;display:block}
/* crew */
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
.disc{width:22px;height:22px;border-radius:50%;flex:none;border:4px solid var(--plate);background:var(--surface)}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:6px 4px}
.board th:first-child,.board td:first-child{text-align:left}
.board td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-weight:600}
.board td.top{color:var(--accent)}
.tablewrap{overflow-x:auto}
.empty{padding:18px 4px;color:var(--muted);text-align:center}
.notice{border-left:4px solid var(--warn);background:var(--sunk);padding:10px 12px;border-radius:6px;font-size:.9rem}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;border-radius:0;background:transparent;padding:12px 4px 14px;font-family:var(--display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--fg);border-top-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
.stack.tight{gap:6px}
button.plain{padding:0;text-align:left;color:inherit;display:flex;flex-direction:column;gap:4px;width:100%}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs" hidden></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
